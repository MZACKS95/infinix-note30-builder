name: Build rfkill-only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rfkill:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            kmod libelf-dev libssl-dev lz4 pahole python3 rsync

      
      - name: Cache Kernel Source
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: android/kernel/common/7c6bbcca33e1
          key: kernel-common-7c6bbcca33e1-v1

      - name: Clone Google Common Kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/android/kernel/common"
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"

          git clone https://android.googlesource.com/kernel/common \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"
          git fetch origin \
            refs/heads/android12-5.10:refs/remotes/origin/android12-5.10
          git checkout --detach 7c6bbcca33e1

      - name: Cache AOSP Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang-aosp
          key: aosp-clang-r416183b-android12-v2

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p clang-aosp
          curl -L --fail --retry 3 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz -C clang-aosp
          rm clang.tar.gz

      - name: Setup Clang
        run: |
          set -e
          CLANG_DIR="$GITHUB_WORKSPACE/clang-aosp"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          chmod +x "$CLANG_DIR/bin/"*
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"

      - name: Prepare Config - RFKILL only
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          make O=out gki_defconfig
          scripts/config --file out/.config \
            -e MODULES \
            -e MODVERSIONS \
            -m RFKILL
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-android12-9-00016-g7c6bbcca33e1-ab12029497"
          make O=out olddefconfig
          make O=out modules_prepare

      - name: Restore Module.symvers
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          test -s "$GITHUB_WORKSPACE/config/Module.symvers"
          mkdir -p "$KERNEL_DIR/out"
          cp "$GITHUB_WORKSPACE/config/Module.symvers" \
            "$KERNEL_DIR/out/Module.symvers"

      - name: Build rfkill only
        run: |
          set -e
          KERNEL_DIR="$GITHUB_WORKSPACE/android/kernel/common/7c6bbcca33e1"
          cd "$KERNEL_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="$GITHUB_WORKSPACE/clang-aosp/bin:$PATH"
          make O=out M=net/rfkill modules
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp out/net/rfkill/rfkill.ko "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts/rfkill.ko"
          file "$GITHUB_WORKSPACE/artifacts/rfkill.ko" || true
          modinfo "$GITHUB_WORKSPACE/artifacts/rfkill.ko" || true

      - name: Upload rfkill
        uses: actions/upload-artifact@v4
        with:
          name: rfkill-only
          path: artifacts/rfkill.ko
          if-no-files-found: error
