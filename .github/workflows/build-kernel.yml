name: Build Kernel Infinix Note 30 (android12-5.10-2024-05_r1)

on:
  workflow_dispatch:

jobs:
  build-gki:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space Server
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Install Builder Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libelf-dev libssl-dev git zip unzip python3 lz4 libio-pty-perl

      - name: Download Official AOSP Clang r487747c
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://googlesource.com
          tar -xf clang-r487747c.tar.gz
          rm clang-r487747c.tar.gz

      - name: Clone Google GKI Source Code
        run: |
          git clone --depth=1 https://googlesource.com -b refs/tags/android12-5.10-2024-05_r1 $GITHUB_WORKSPACE/kernel

      - name: Execute GNU Make Builder
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. Membuat file konfigurasi tambahan khusus untuk wifi luar (ekstensi .config)
          echo "CONFIG_NET_CORE=y" > wifi_ext.config
          echo "CONFIG_WLAN=y" >> wifi_ext.config
          echo "CONFIG_MT76_CORE=m" >> wifi_ext.config
          echo "CONFIG_MT76_USB=m" >> wifi_ext.config
          echo "CONFIG_MT7601U=m" >> wifi_ext.config
          echo "CONFIG_ATH_COMMON=m" >> wifi_ext.config
          echo "CONFIG_ATH_CARDS=m" >> wifi_ext.config
          echo "CONFIG_ATH9K_HW=m" >> wifi_ext.config
          echo "CONFIG_ATH9K_COMMON=m" >> wifi_ext.config
          echo "CONFIG_ATH9K_HTC=m" >> wifi_ext.config
          echo "CONFIG_ATH10K=m" >> wifi_ext.config
          echo "CONFIG_ATH10K_USB=m" >> wifi_ext.config
          
          # 2. Menggabungkan gki_defconfig bawaan Google dengan konfigurasi wifi baru kita secara aman
          ARCH=arm64 scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig wifi_ext.config
          
          # 3. Memperbarui dependensi konfigurasi otomatis agar tidak memicu Exit Code 2
          make ARCH=arm64 O=out olddefconfig
          
          # 4. Mulai proses memasak kernel + modul .ko
          make ARCH=arm64 O=out -j$(nproc --all) LLVM=1 LLVM_IAS=1

      - name: Collect and Package .ko Files
        run: |
          mkdir -p $GITHUB_WORKSPACE/output_modules
          find $GITHUB_WORKSPACE/kernel/out/ -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/output_modules/ \;

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Note30-Kernel-and-Modules
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.lz4
            kernel/out/arch/arm64/boot/Image.gz
            output_modules/
