name: Build Kernel Infinix Note 30 (android12-5.10-2024-05_r1)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan Kompilasi via Dabao Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://googlesource.com
          kernel-branch: refs/tags/android12-5.10-2024-05_r1
          config: gki_defconfig
          arch: arm64
          aosp-clang: true
          aosp-clang-version: r487747c
          extra-cmd: |
            echo "CONFIG_NET_CORE=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_WLAN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_MT76_CORE=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_MT76_USB=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_MT7601U=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH_COMMON=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH_CARDS=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH9K_HW=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH9K_COMMON=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH10K=m" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_ATH10K_USB=m" >> arch/arm64/configs/gki_defconfig
