name: Build Kernel Infinix Note 30 (android12-5.10-2024-05_r1)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan Kompilasi via Dabao Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://googlesource.com
          kernel-branch: refs/tags/android12-5.10-2024-05_r1
          config: gki_defconfig
          arch: arm64
          aosp-clang: true
          aosp-clang-version: r487747c
          aosp-gcc: true # Mengaktifkan GCC pendamping untuk mengatasi error silang merah Anda
          anykernel3: true # Otomatis membungkus hasil kompilasi menjadi file .zip flashable
          extra-make-args: |
            CONFIG_NET_CORE=y
            CONFIG_WLAN=y
            CONFIG_MT76_CORE=m
            CONFIG_MT76_USB=m
            CONFIG_MT7601U=m
            CONFIG_ATH_COMMON=m
            CONFIG_ATH_CARDS=m
            CONFIG_ATH9K_HW=m
            CONFIG_ATH9K_COMMON=m
            CONFIG_ATH9K_HTC=m
            CONFIG_ATH10K=m
            CONFIG_ATH10K_USB=m
